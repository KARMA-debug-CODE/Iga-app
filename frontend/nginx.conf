# Serves the built single-page app and forwards API/admin traffic to Django.
# Put this behind your HTTPS load balancer or Cloudflare (docs/CLOUDFLARE.md), or add certificates here.
#
# A template: when the web image starts it fills in the ${NGINX_...} settings (defaults and meanings in
# nginx/defaults.envsh; set them in .env). nginx's own variables ($host, $remote_addr, ...) are left alone.

# Who the client is: nginx/real-ip.sh writes this at start from NGINX_TRUSTED_PROXIES. Only those proxies
# may name the client; anyone else is known by the address that connected, whatever headers they send.
include /etc/nginx/iga/real-ip.conf;

# The scheme the browser used: X-Forwarded-Proto from a trusted proxy that terminated TLS, else nginx's own.
map "$iga_via_trusted_proxy:$http_x_forwarded_proto" $iga_scheme {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# HTTPS (NGINX_FORCE_HTTPS, on unless HTTPS=false): plain HTTP is redirected, except Let's Encrypt's checks.
map "${NGINX_FORCE_HTTPS}:$iga_scheme:$request_uri" $iga_redirect_to_https {
    "~^true:http:/\.well-known/acme-challenge/" 0;
    "~^true:http:" 1;
    default 0;
}
# HSTS on every answer sent over HTTPS (browsers ignore it over HTTP), as Django sends it on the API's.
map "${NGINX_HSTS_PRELOAD}" $iga_hsts_preload {
    true    "; preload";
    default "";
}
map "${NGINX_FORCE_HTTPS}:$iga_scheme" $iga_hsts {
    "true:https" "max-age=${NGINX_HSTS_MAX_AGE}; includeSubDomains$iga_hsts_preload";
    default "";
}
# The app's Content-Security-Policy (NGINX_CSP; nginx/headers-app.conf sends it).
map $iga_scheme $iga_csp {
    default "${NGINX_CSP}";
}

# --- Rate limits, per client address (Django adds its own per account and per user) ---------------------
# Sign-in, sign-up, password reset, 2FA, step-up and password changes; the Django admin.
limit_req_zone $binary_remote_addr zone=iga_auth:10m rate=${NGINX_RATE_AUTH};
# Santa's answers, C++/Java runs, payments.
limit_req_zone $binary_remote_addr zone=iga_costly:10m rate=${NGINX_RATE_COSTLY};
# Every other API request.
limit_req_zone $binary_remote_addr zone=iga_api:20m rate=${NGINX_RATE_API};
# Requests in progress at once.
limit_conn_zone $binary_remote_addr zone=iga_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Refusals in the reader's language (the app sends Accept-Language), as JSON like Django's own.
map $http_accept_language $iga_too_many {
    "~*^fr" '{"detail": "Trop de requêtes. Patientez un instant, puis réessayez."}';
    default '{"detail": "Too many requests. Please wait a moment and try again."}';
}
map $http_accept_language $iga_too_large {
    "~*^fr" '{"detail": "Cette requête est trop volumineuse."}';
    default '{"detail": "This request is too large."}';
}
# Django can't be reached or didn't answer in time (a restart, an update, a crash): the app reads this JSON and
# says so in the reader's language. Django's own answers, its 500s included, pass through as they are.
map $http_accept_language $iga_unavailable {
    "~*^fr" '{"detail": "Iga ne répond pas pour le moment. Réessayez dans quelques minutes.", "code": "unavailable"}';
    default '{"detail": "Iga is not answering right now. Please try again in a few minutes.", "code": "unavailable"}';
}

# Maintenance mode (backend/apps/core/maintenance.py): on while /srv/maintenance/on exists (`manage.py maintenance
# on` writes it in the volume docker compose shares with this container) or NGINX_MAINTENANCE is true. The app's
# pages then answer 503 with errors/maintenance.html, except for the Iga team: the iga_team cookie (Django gives
# it to platform admins only) and /team, where they sign in. It is only a hint for nginx: Django refuses every
# API request from anyone but a platform admin, whatever cookies they send. $iga_maintenance is set per request
# in the server block.
map "$iga_maintenance:$cookie_iga_team" $iga_back_soon {
    "true:1" 0;
    "~^true:" 1;
    default 0;
}

# The Content-Security-Policy for an uploaded file sent from /protected-media/ (the same as
# backend/apps/core/media.py): images and media may show themselves and nothing else, PDFs may not run
# scripts or plugins (browsers' PDF viewers don't work in a sandbox), everything else is sandboxed.
map $uri $upload_csp {
    default                                 "sandbox; default-src 'none'";
    "~*\.(png|jpe?g|gif|webp|mp3|mp4)$"     "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'";
    "~*\.pdf$"                              "default-src 'none'; object-src 'none'; script-src 'none'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # HTTPS served by nginx itself: put a tls.conf (see nginx/tls.conf.example) in /etc/nginx/iga/tls/.
    include /etc/nginx/iga/tls/*.conf;

    # Request bodies: tiny by default, 2 MB for the API, more only where files are uploaded (NGINX_MAX_BODY_*).
    # A bigger one is refused (JSON 413) before any of it reaches Django.
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;

    # Slow clients ("slowloris"): the request line and headers must arrive within
    # NGINX_CLIENT_HEADER_TIMEOUT, and the body and the answer may not stall longer than
    # NGINX_CLIENT_BODY_TIMEOUT and NGINX_SEND_TIMEOUT between two reads. nginx reads each request whole
    # before passing it on, so slow clients only ever hold nginx's cheap connections, never Django's threads.
    client_header_timeout ${NGINX_CLIENT_HEADER_TIMEOUT};
    client_body_timeout ${NGINX_CLIENT_BODY_TIMEOUT};
    send_timeout ${NGINX_SEND_TIMEOUT};
    keepalive_timeout ${NGINX_KEEPALIVE_TIMEOUT};
    keepalive_requests 1000;
    reset_timedout_connection on;

    # NGINX_ONLY_FROM_TRUSTED_PROXIES=true: requests that didn't come through Cloudflare (or your load
    # balancer) are dropped without an answer.
    if ($iga_refuse_direct) {
        return 444;
    }
    if ($iga_redirect_to_https) {
        return 301 https://$host$request_uri;
    }

    limit_conn iga_conn ${NGINX_CONN_PER_IP};
    error_page 429 @too_many_requests;
    error_page 413 @too_large;
    # Django can't be reached (the API locations answer JSON instead: nginx/errors-api.conf).
    error_page 500 502 503 504 /errors/500.html;

    set $iga_maintenance "${NGINX_MAINTENANCE}";
    if (-f /srv/maintenance/on) {
        set $iga_maintenance "true";
    }

    # Django's answers (Santa's stream and C++/Java runs allow longer, below).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Let's Encrypt's HTTP check (certbot --webroot -w /var/www/certbot), if you use it.
    location ^~ /.well-known/acme-challenge/ {
        include /etc/nginx/iga/headers-common.conf;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location @too_many_requests {
        default_type "application/json; charset=utf-8";
        include /etc/nginx/iga/headers-common.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 $iga_too_many;
    }

    location @too_large {
        default_type "application/json; charset=utf-8";
        include /etc/nginx/iga/headers-common.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        return 413 $iga_too_large;
    }

    location @api_unavailable {
        default_type "application/json; charset=utf-8";
        include /etc/nginx/iga/headers-common.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 $iga_unavailable;
    }

    # nginx's own pages, self-contained (no script): Django unreachable, and maintenance mode's "back soon".
    location ^~ /errors/ {
        internal;
        include /etc/nginx/iga/headers-app.conf;
        add_header Cache-Control "no-store" always;
    }

    # Sign-in, sign-up, password reset, 2FA, step-up, password changes, "Download my data" and "Delete my
    # account": the strict limit.
    location ~ ^/api/auth/(login|register|password-reset|password|2fa|step-up|my-data|delete-account)/ {
        limit_req zone=iga_auth burst=${NGINX_BURST_AUTH} nodelay;
        client_max_body_size 64k;
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # The public contact form: the strict limit too (Django adds its own per address).
    location = /api/contact/ {
        limit_req zone=iga_auth burst=${NGINX_BURST_AUTH} nodelay;
        client_max_body_size 64k;
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # For search engines: Django writes them with the site's public address (FRONTEND_URL).
    location = /robots.txt {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }
    location = /sitemap.xml {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # Payments (checkout, confirmation, the provider's webhooks): the costly limit.
    location ^~ /api/billing/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_API};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # Starting a C++ or Java program compiles it on the code runner: the costly limit. Its answers,
    # status and stop are ordinary API requests (below). Compiling and the first run take up to 45 s.
    location = /api/code/run/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_API};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # Whether Santa is ready: asked by every lesson page, so an ordinary API request.
    location = /api/tutor/status/ {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_API};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # Santa's answers: the costly limit, and fewer at once per address. The stream (Server-Sent Events) must
    # reach the student as it is written, so it is never buffered, and a whole answer from a CPU server can
    # take a few minutes (SANTA_TIMEOUT_SECONDS).
    location ^~ /api/tutor/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_API};
        limit_conn iga_conn ${NGINX_CONN_PER_IP_TUTOR};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 200s;
    }

    # Teachers' resources (textbooks, notes) are uploaded here: the only API route for files.
    location ~ ^/api/resources(/|$) {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_UPLOAD};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # The rest of the API.
    location /api/ {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        client_max_body_size ${NGINX_MAX_BODY_API};
        include /etc/nginx/iga/proxy.conf;
        include /etc/nginx/iga/errors-api.conf;
    }

    # The Django admin (off unless enabled, at a secret path): its sign-in shares the strict limit.
    location ^~ /django-admin/ {
        limit_req zone=iga_auth burst=${NGINX_BURST_AUTH} nodelay;
        # Past papers and marking guides are uploaded here.
        client_max_body_size ${NGINX_MAX_BODY_UPLOAD};
        include /etc/nginx/iga/proxy.conf;
    }

    # The Django admin's own CSS and JavaScript.
    location ^~ /static/ {
        include /etc/nginx/iga/proxy.conf;
    }

    # Uploaded files (teachers' resources, past papers, marking guides) are never served directly: each one
    # is private. Django checks the viewer may have it, then hands it over with X-Accel-Redirect from the
    # internal location below (backend/apps/core/media.py).
    location ^~ /media/ {
        return 404;
    }
    # Uploads are untrusted: they can't run scripts on this site, and anything that isn't a PDF, image or
    # media file downloads instead of opening in the browser. Django sets Content-Type, Content-Disposition
    # and Cache-Control, which nginx keeps on an X-Accel-Redirect; it drops Django's other headers, so the
    # same policy is set here ($upload_csp, above). Keep the two in step.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location ^~ /protected-media/ {
        internal;
        alias /srv/media/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy $upload_csp always;
        add_header Strict-Transport-Security $iga_hsts always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        include /etc/nginx/iga/headers-app.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted language runtimes (Python, SQL, ...). Versioned by the app release, so cache them.
    location ~ ^/(pyodide|runtimes)/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/zip zip;
            application/json json;
        }
        expires 30d;
        include /etc/nginx/iga/headers-app.conf;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/iga/headers-app.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The HTML playground's preview. The app frames it sandboxed (scripts, but no access to Iga's origin,
    # cookies or storage) and posts the student's page to it. Students' pages run their own inline scripts and
    # styles, so it has its own policy, sandboxed even if opened on its own; only Iga may frame it.
    location = /playground-frame.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $iga_hsts always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-modals; default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The app. Public pages have their own copy of index.html with their title and link-preview tags
    # (/terms -> terms.html, scripts/public-pages.mjs); every other route is index.html.
    location / {
        include /etc/nginx/iga/headers-app.conf;
        # A location with its own error pages drops the server's: these repeat them.
        error_page 429 @too_many_requests;
        error_page 413 @too_large;
        error_page 503 /errors/maintenance.html;
        if ($iga_back_soon) {
            return 503;
        }
        try_files $uri $uri.html /index.html;
    }

    # Where the Iga team signs in during maintenance mode: always the app.
    location = /team {
        include /etc/nginx/iga/headers-app.conf;
        try_files /index.html =404;
    }
}
