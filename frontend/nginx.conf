# Serves the built single-page app and forwards API/admin traffic to Django.
# Put this behind your HTTPS load balancer or Cloudflare (docs/CLOUDFLARE.md), or add certificates here.
#
# A template: when the web image starts it fills in the ${NGINX_...} settings (defaults and meanings in
# nginx/defaults.envsh; set them in .env). nginx's own variables ($host, $remote_addr, ...) are left alone.

# Who the client is: nginx/real-ip.sh writes this at start from NGINX_TRUSTED_PROXIES. Only those proxies
# may name the client; anyone else is known by the address that connected, whatever headers they send.
include /etc/nginx/iga/real-ip.conf;

# The scheme the browser used: X-Forwarded-Proto from a trusted proxy that terminated TLS, else nginx's own.
map "$iga_via_trusted_proxy:$http_x_forwarded_proto" $iga_scheme {
    "1:https" https;
    "1:http"  http;
    default   $scheme;
}

# --- Rate limits, per client address (Django adds its own per account and per user) ---------------------
# Sign-in, sign-up, password reset, 2FA, step-up and password changes; the Django admin.
limit_req_zone $binary_remote_addr zone=iga_auth:10m rate=${NGINX_RATE_AUTH};
# Santa's answers, C++/Java runs, payments.
limit_req_zone $binary_remote_addr zone=iga_costly:10m rate=${NGINX_RATE_COSTLY};
# Every other API request.
limit_req_zone $binary_remote_addr zone=iga_api:20m rate=${NGINX_RATE_API};
# Requests in progress at once.
limit_conn_zone $binary_remote_addr zone=iga_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Refusals in the reader's language (the app sends Accept-Language), as JSON like Django's own.
map $http_accept_language $iga_too_many {
    "~*^fr" '{"detail": "Trop de requêtes. Patientez un instant, puis réessayez."}';
    default '{"detail": "Too many requests. Please wait a moment and try again."}';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    # NGINX_ONLY_FROM_TRUSTED_PROXIES=true: requests that didn't come through Cloudflare (or your load
    # balancer) are dropped without an answer.
    if ($iga_refuse_direct) {
        return 444;
    }

    limit_conn iga_conn ${NGINX_CONN_PER_IP};
    error_page 429 @too_many_requests;

    # Django's answers (Santa's stream and C++/Java runs allow longer, below).
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location @too_many_requests {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 10 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        return 429 $iga_too_many;
    }

    # Sign-in, sign-up, password reset, 2FA, step-up and password changes: the strict limit.
    location ~ ^/api/auth/(login|register|password-reset|password|2fa|step-up)/ {
        limit_req zone=iga_auth burst=${NGINX_BURST_AUTH} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # Payments (checkout, confirmation, the provider's webhooks): the costly limit.
    location ^~ /api/billing/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # Starting a C++ or Java program compiles it on the code runner: the costly limit. Its answers,
    # status and stop are ordinary API requests (below).
    location = /api/code/run/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # Whether Santa is ready: asked by every lesson page, so an ordinary API request.
    location = /api/tutor/status/ {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # Santa's answers: the costly limit, and fewer at once per address. The stream (Server-Sent Events) must
    # reach the student as it is written, so it is never buffered, and a whole answer from a CPU server can
    # take a few minutes (SANTA_TIMEOUT_SECONDS).
    location ^~ /api/tutor/ {
        limit_req zone=iga_costly burst=${NGINX_BURST_COSTLY} nodelay;
        limit_conn iga_conn ${NGINX_CONN_PER_IP_TUTOR};
        include /etc/nginx/iga/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 200s;
    }

    # The rest of the API.
    location /api/ {
        limit_req zone=iga_api burst=${NGINX_BURST_API} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # The Django admin (off unless enabled, at a secret path): its sign-in shares the strict limit.
    location ^~ /django-admin/ {
        limit_req zone=iga_auth burst=${NGINX_BURST_AUTH} nodelay;
        include /etc/nginx/iga/proxy.conf;
    }

    # The Django admin's own CSS and JavaScript.
    location ^~ /static/ {
        include /etc/nginx/iga/proxy.conf;
    }

    # Uploaded past papers and marking guides are part of the school subscription: never served
    # directly. Django checks access, then hands the file over with X-Accel-Redirect.
    location ^~ /media/exam_papers/ {
        return 404;
    }
    location /protected-media/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Uploaded textbooks, papers and resources (shared volume with the backend).
    # Uploads are untrusted: they can't run scripts on this site, and anything that
    # isn't a PDF, image or media file downloads instead of opening in the browser.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location /media/ {
        root /srv;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Content-Disposition attachment always;

        location ~* \.(png|jpe?g|gif|webp|mp3|mp4)$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        }
        # Browsers' PDF viewers don't run under a CSP sandbox; block scripts and plugins instead.
        location ~* \.pdf$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'; object-src 'none'; script-src 'none'" always;
        }
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted language runtimes (Python, SQL, ...). Versioned by the app release, so cache them.
    location ~ ^/(pyodide|runtimes)/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/zip zip;
            application/json json;
        }
        expires 30d;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
