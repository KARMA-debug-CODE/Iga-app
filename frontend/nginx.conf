# Serves the built single-page app and forwards API/admin traffic to Django.
# Put this behind your HTTPS load balancer (or add certificates here).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|django-admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded past papers and marking guides are part of the school subscription: never served
    # directly. Django checks access, then hands the file over with X-Accel-Redirect.
    location ^~ /media/exam_papers/ {
        return 404;
    }
    location /protected-media/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    # Uploaded textbooks, papers and resources (shared volume with the backend).
    # Uploads are untrusted: they can't run scripts on this site, and anything that
    # isn't a PDF, image or media file downloads instead of opening in the browser.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location /media/ {
        root /srv;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header Content-Disposition attachment always;

        location ~* \.(png|jpe?g|gif|webp|mp3|mp4)$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'" always;
        }
        # Browsers' PDF viewers don't run under a CSP sandbox; block scripts and plugins instead.
        location ~* \.pdf$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Content-Security-Policy "default-src 'none'; object-src 'none'; script-src 'none'" always;
        }
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted language runtimes (Python, SQL, ...). Versioned by the app release, so cache them.
    location ~ ^/(pyodide|runtimes)/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/zip zip;
            application/json json;
        }
        expires 30d;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
