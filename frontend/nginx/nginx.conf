# nginx's main configuration for the web image (the site itself is ../nginx.conf). The image's defaults,
# plus what keeps a flood of connections from tying up the server: more connections per worker (each
# proxied request uses two), no version number in answers, and the request time in the access log.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;

    include /etc/nginx/conf.d/*.conf;
}
