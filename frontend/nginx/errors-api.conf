# Error answers for the locations that forward to Django (a location with its own error pages drops the server's,
# so this repeats nginx's JSON 429 and 413). When Django can't be reached or doesn't answer in time, the app gets
# a JSON 503 in the reader's language (@api_unavailable in ../nginx.conf) instead of nginx's HTML page. Django's
# own answers, its 500s and maintenance mode's 503 included, pass through untouched: nginx doesn't intercept them.
error_page 429 @too_many_requests;
error_page 413 @too_large;
error_page 500 502 503 504 @api_unavailable;
