# How a request reaches Django (included in each location that forwards to it).
proxy_pass http://backend:8000;
proxy_set_header Host $host;
# Exactly one address: the client as nginx sees it (after real-ip.conf). Django trusts this one hop
# (TRUSTED_PROXY_COUNT=1); whatever the client put in its own X-Forwarded-For is dropped here.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# http or https as the browser used it; Django believes it (SECURE_PROXY_SSL_HEADER) because only nginx can reach it.
proxy_set_header X-Forwarded-Proto $iga_scheme;
proxy_set_header X-Forwarded-Host "";
proxy_set_header CF-Connecting-IP "";
