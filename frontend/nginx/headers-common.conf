# Security headers on every answer nginx makes itself (the app, its files, uploads, nginx's own refusals).
# Answers from Django carry Django's own (apps/core/middleware.py), so the API locations don't include this.
# nginx drops server-level add_header lines in a location that has its own, hence an include everywhere.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Over HTTPS only (empty, so not sent, over plain HTTP or with HTTPS=false); see $iga_hsts in ../nginx.conf.
add_header Strict-Transport-Security $iga_hsts always;
