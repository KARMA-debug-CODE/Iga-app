# Security headers on every answer nginx makes itself (the app, its files, uploads, nginx's own refusals).
# Answers from Django carry Django's own (apps/core/middleware.py), so the API locations don't include this.
# nginx drops outer add_header lines in a location that has its own, hence an include in each location.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Over HTTPS only (empty, so not sent, over plain HTTP or with HTTPS=false); see $iga_hsts in ../nginx.conf.
add_header Strict-Transport-Security $iga_hsts always;
# No other site may frame Iga's pages (clickjacking); the CSP's frame-ancestors says the same to newer browsers.
add_header X-Frame-Options "DENY" always;
# No other window keeps a handle on ours, and other sites can't embed Iga's files.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# No camera, microphone, location, payment or device APIs; full screen for the app and the labs it embeds.
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), display-capture=(), browsing-topics=(), fullscreen=(self "https://phet.colorado.edu" "https://www.geogebra.org")' always;
