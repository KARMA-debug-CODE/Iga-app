# Local trial of the production setup: PostgreSQL + Redis + Django (gunicorn) + nginx, plus Iga's code
# runner for C++ and Java in the code playground, and (optional) Santa's model server (Iga's own AI tutor).
#   cp .env.docker.example .env      # then fill in DJANGO_SECRET_KEY (see the file)
#   docker compose up --build        # the app, without Santa's model (Santa answers from the lessons)
#   docker compose --profile santa up --build -d   # with Santa's model (or COMPOSE_PROFILES=santa in .env);
#                                                  # its first start downloads the model once (about 4.5 GB)
#   docker compose exec backend python manage.py load_curriculum
#   docker compose exec -e DJANGO_DEBUG=true backend python manage.py seed_demo   # optional demo accounts (local trial only)
# Then open http://localhost:8080
#
# For a real deployment, use strong secrets in .env, serve over HTTPS and remove
# HTTPS=false from .env (HTTPS defaults to on), and set a random CODE_RUNNER_TOKEN, SANTA_API_KEY,
# POSTGRES_PASSWORD, POSTGRES_OWNER_PASSWORD and POSTGRES_APP_PASSWORD.
services:
  # Three database roles: "iga" is the superuser, used only by the migrate service below to set up the
  # other two; iga_owner owns the tables and runs the migrations; iga_app, the only role the backend and
  # the scheduler know, may read and write rows and nothing else (docs/ARCHITECTURE.md, "Database roles").
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iga
      POSTGRES_USER: iga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iga-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iga -d iga"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment: &backend-env
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env - see .env.docker.example}
      # Encrypts 2FA secrets, phone numbers and payment details in the database. Back it up apart from the database.
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:?Set FIELD_ENCRYPTION_KEYS in .env - see .env.docker.example}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # The app role: rows only (no superuser, no CREATE/ALTER/DROP/TRUNCATE, no new roles or databases).
      DATABASE_URL: postgres://iga_app:${POSTGRES_APP_PASSWORD:-iga-local-app}@db:5432/iga
      REDIS_URL: redis://redis:6379/0
      HTTPS: ${HTTPS:-true}
      # Always 1 with the bundled nginx: nginx works out the client's address (NGINX_TRUSTED_PROXIES on the
      # web service) and passes exactly that one in X-Forwarded-For.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}
      DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-}
      # Santa, Iga's own AI tutor: the "santa" service below, started only with the "santa" profile. Without
      # it the host "santa" doesn't resolve and the app says the model is not installed; Santa then answers
      # from the lessons only (as it does with SANTA_URL= (empty) in .env).
      SANTA_URL: ${SANTA_URL-http://santa:8080}
      SANTA_API_KEY: ${SANTA_API_KEY:-iga-local-santa}
      SANTA_MAX_TOKENS: ${SANTA_MAX_TOKENS:-600}
      SANTA_TEMPERATURE: ${SANTA_TEMPERATURE:-0.6}
      SANTA_TIMEOUT_SECONDS: ${SANTA_TIMEOUT_SECONDS:-150}
      SANTA_PARALLEL: ${SANTA_PARALLEL:-4}
      # C++ and Java in the code playground. Set CODE_RUNNER_URL= (empty) in .env to switch them off.
      CODE_RUNNER_URL: ${CODE_RUNNER_URL-http://coderunner:2000}
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-iga-local-code-runner}
      # Protected past-paper files are sent by nginx after Django checks access.
      PROTECTED_MEDIA_ACCEL: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # School subscriptions (see .env.docker.example).
      SUBSCRIPTION_PRICE_USD: ${SUBSCRIPTION_PRICE_USD:-200}
      SUBSCRIPTION_PRICE_RWF: ${SUBSCRIPTION_PRICE_RWF:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      BILLING_DEV_MODE: ${BILLING_DEV_MODE:-false}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      BILLING_ALLOW_TEST_PAYMENTS: ${BILLING_ALLOW_TEST_PAYMENTS:-false}
      # Signs the money ledger's hash chain (see .env.docker.example). Once set, keep it.
      LEDGER_HMAC_KEY: ${LEDGER_HMAC_KEY:-}
      CHECKOUT_SESSION_MINUTES: ${CHECKOUT_SESSION_MINUTES:-60}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Iga <no-reply@iga.rw>}
      # gunicorn (backend/gunicorn.conf.py has the rest): processes, and threads per process, so slow calls
      # (Santa's answers, C++/Java runs) don't hold up other requests.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      - media:/app/media
    networks: [default, coderunner, santa]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Runs before the backend and the scheduler start, then exits. With the superuser, it creates or updates
  # the iga_owner and iga_app roles (passwords from .env, so changing them there rotates them) and moves
  # tables left by an older single-role setup to iga_owner; then it applies the migrations as iga_owner.
  # Only this short-lived container ever holds the superuser and owner passwords.
  migrate:
    build: ./backend
    command: sh -c 'python manage.py db_roles && DATABASE_URL="$$DB_OWNER_URL" python manage.py migrate --noinput'
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://iga:${POSTGRES_PASSWORD:-iga-local-only}@db:5432/iga
      DB_OWNER_URL: postgres://iga_owner:${POSTGRES_OWNER_PASSWORD:-iga-local-owner}@db:5432/iga
      DB_APP_URL: postgres://iga_app:${POSTGRES_APP_PASSWORD:-iga-local-app}@db:5432/iga
    depends_on:
      db:
        condition: service_healthy

  # Sends subscription reminders to school administrators once a day.
  scheduler:
    build: ./backend
    # Every 10 minutes: re-check open payments (lost webhooks, abandoned checkouts) and send any
    # subscription reminders that are due (each is sent once, so running often is safe).
    # Starts once the migrate service has applied the database migrations, and checks again before its first run.
    command: sh -c "until python manage.py migrate --check > /dev/null 2>&1; do sleep 5; done; while true; do python manage.py reconcile_payments; python manage.py billing_reminders; sleep 600; done"
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Compiles and runs students' C++ and Java (coderunner/: official GCC and OpenJDK images, nothing to
  # download at start). Only the backend can reach it: no published port, and its network has no internet.
  # Each program runs as its own unprivileged user with time, memory, process and output limits; the
  # container itself has no other privileges.
  coderunner:
    build: ./coderunner
    init: true
    restart: unless-stopped
    environment:
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-iga-local-code-runner}
      CODE_RUNNER_SLOTS: ${CODE_RUNNER_SLOTS:-4}
    cap_drop: [ALL]
    # Start each program as its slot's user, clean up after it, and see when it waits for input.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, SYS_PTRACE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=256m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    networks: [coderunner]

  # Santa's brain: llama.cpp's llama-server running an open model (Gemma 4 E4B by default, Apache-2.0) on
  # this server's CPU. Only the backend talks to it, on the internal "santa" network, with SANTA_API_KEY;
  # no port is published. The first start downloads the model once into the santa-models volume (about
  # 4.5 GB; Santa answers from the lessons until it is ready). A 16 GB RAM server is recommended; on an 8 GB
  # server set SANTA_MODEL=google/gemma-4-E2B-it-qat-q4_0-gguf:Q4_0 and SANTA_MEMORY_LIMIT=5g in .env.
  # Once the model is downloaded, SANTA_OFFLINE=true keeps it from ever going online. README: "Santa".
  # The image is the CPU build for amd64 and arm64, and checks itself (HEALTHCHECK on :8080/health).
  # Optional: it starts only with `docker compose --profile santa up` (or COMPOSE_PROFILES=santa in .env), so
  # the rest of the app starts even where its image or model can't be downloaded.
  santa:
    image: ghcr.io/ggml-org/llama.cpp:server-b11151
    profiles: [santa]
    restart: unless-stopped
    command:
      - -hf
      - ${SANTA_MODEL:-google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0}
      - --no-mmproj # text only: skip the image and audio part of the model
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c # context, shared by the 4 parallel answers (about 4,000 tokens each)
      - "16384"
      - -np
      - "4"
      - -t # CPU threads: the number of physical cores is best
      - ${SANTA_THREADS:-4}
      - -tb
      - ${SANTA_THREADS:-4}
      - --reasoning # answer straight away, without a hidden "thinking" phase
      - "off"
      - --cache-ram # MiB of RAM to keep recent prompts (Santa's instructions) ready for reuse
      - "1024"
      - -n # the longest answer, in tokens (Django asks for SANTA_MAX_TOKENS)
      - "768"
      - --alias # the model's name in the API (Django's SANTA_MODEL_NAME)
      - santa
      - --metrics # Prometheus numbers at /metrics
    environment:
      LLAMA_CACHE: /models
      LLAMA_API_KEY: ${SANTA_API_KEY:-iga-local-santa}
      # true = use only the model already in /models and never go online.
      LLAMA_ARG_OFFLINE: ${SANTA_OFFLINE:-false}
      # Only for gated or private models on Hugging Face.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - santa-models:/models
    mem_limit: ${SANTA_MEMORY_LIMIT:-8g}
    # "santa" (internal) is how Django reaches it; "santa-download" only lets it fetch the model.
    networks: [santa, santa-download]

  web:
    build: ./frontend
    ports:
      - "8080:80"
    # nginx's settings: frontend/nginx/defaults.envsh has every one and its default (empty = the default).
    environment:
      # Who may say who the client is: empty = nobody (the client is whoever connects), "cloudflare", and/or
      # your load balancer's addresses. docs/CLOUDFLARE.md.
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-}
      NGINX_REAL_IP_HEADER: ${NGINX_REAL_IP_HEADER:-}
      # true = drop requests that didn't come through those proxies.
      NGINX_ONLY_FROM_TRUSTED_PROXIES: ${NGINX_ONLY_FROM_TRUSTED_PROXIES:-false}
      # Per-address rate limits: sign-in and the like, costly routes (Santa, C++/Java runs, payments), the rest.
      NGINX_RATE_AUTH: ${NGINX_RATE_AUTH:-}
      NGINX_BURST_AUTH: ${NGINX_BURST_AUTH:-}
      NGINX_RATE_COSTLY: ${NGINX_RATE_COSTLY:-}
      NGINX_BURST_COSTLY: ${NGINX_BURST_COSTLY:-}
      NGINX_RATE_API: ${NGINX_RATE_API:-}
      NGINX_BURST_API: ${NGINX_BURST_API:-}
      NGINX_CONN_PER_IP: ${NGINX_CONN_PER_IP:-}
      NGINX_CONN_PER_IP_TUTOR: ${NGINX_CONN_PER_IP_TUTOR:-}
      # Slow clients and request sizes.
      NGINX_CLIENT_HEADER_TIMEOUT: ${NGINX_CLIENT_HEADER_TIMEOUT:-}
      NGINX_CLIENT_BODY_TIMEOUT: ${NGINX_CLIENT_BODY_TIMEOUT:-}
      NGINX_SEND_TIMEOUT: ${NGINX_SEND_TIMEOUT:-}
      NGINX_KEEPALIVE_TIMEOUT: ${NGINX_KEEPALIVE_TIMEOUT:-}
      NGINX_MAX_BODY_API: ${NGINX_MAX_BODY_API:-}
      NGINX_MAX_BODY_UPLOAD: ${NGINX_MAX_BODY_UPLOAD:-}
    volumes:
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  santa-models:

networks:
  default: {}
  # Internal only: the code runner can't reach the internet, and only the backend can reach it.
  coderunner:
    internal: true
  # Internal only: Django and Santa's model server, nothing else.
  santa:
    internal: true
  # Lets Santa's model server download its model (nothing else is on it, and no port is published).
  # With SANTA_OFFLINE=true it is not used; remove it from the santa service to cut it off completely.
  santa-download: {}
