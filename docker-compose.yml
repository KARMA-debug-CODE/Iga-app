# Local trial of the production setup: PostgreSQL + Redis + Django (gunicorn) + nginx.
#   cp .env.docker.example .env      # then fill in DJANGO_SECRET_KEY (see the file)
#   docker compose up --build
#   docker compose exec backend python manage.py load_curriculum
#   docker compose exec backend python manage.py seed_demo --force   # optional demo accounts
# Then open http://localhost:8080
#
# For a real deployment, use strong secrets in .env, serve over HTTPS and remove
# HTTPS=false from .env (HTTPS defaults to on).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iga
      POSTGRES_USER: iga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iga-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iga -d iga"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment: &backend-env
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env - see .env.docker.example}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: postgres://iga:${POSTGRES_PASSWORD:-iga-local-only}@db:5432/iga
      REDIS_URL: redis://redis:6379/0
      HTTPS: ${HTTPS:-true}
      # nginx in front appends the client address to X-Forwarded-For.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Protected past-paper files are sent by nginx after Django checks access.
      PROTECTED_MEDIA_ACCEL: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # School subscriptions (see .env.docker.example).
      SUBSCRIPTION_PRICE_USD: ${SUBSCRIPTION_PRICE_USD:-200}
      SUBSCRIPTION_PRICE_RWF: ${SUBSCRIPTION_PRICE_RWF:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      BILLING_DEV_MODE: ${BILLING_DEV_MODE:-false}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      CHECKOUT_SESSION_MINUTES: ${CHECKOUT_SESSION_MINUTES:-60}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Iga <no-reply@iga.rw>}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Sends subscription reminders to school administrators once a day.
  scheduler:
    build: ./backend
    # Every 10 minutes: re-check open payments (lost webhooks, abandoned checkouts) and send any
    # subscription reminders that are due (each is sent once, so running often is safe).
    command: sh -c "while true; do python manage.py reconcile_payments; python manage.py billing_reminders; sleep 600; done"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
