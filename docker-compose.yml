# Local trial of the production setup: PostgreSQL + Redis + Django (gunicorn) + nginx.
#   docker compose up --build
#   docker compose exec backend python manage.py load_curriculum
#   docker compose exec backend python manage.py seed_demo --force   # optional demo accounts
# Then open http://localhost:8080
#
# For a real deployment, set strong secrets in a .env file next to this one,
# serve over HTTPS and set HTTPS=true (the default when it is unset).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iga
      POSTGRES_USER: iga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iga-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iga -d iga"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me-0f8e7c2b9a}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: postgres://iga:${POSTGRES_PASSWORD:-iga-local-only}@db:5432/iga
      REDIS_URL: redis://redis:6379/0
      HTTPS: ${HTTPS:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
