# Local trial of the production setup: PostgreSQL + Redis + Django (gunicorn) + nginx, plus Iga's code
# runner for C++ and Java in the code playground.
#   cp .env.docker.example .env      # then fill in DJANGO_SECRET_KEY (see the file)
#   docker compose up --build
#   docker compose exec backend python manage.py load_curriculum
#   docker compose exec backend python manage.py seed_demo --force   # optional demo accounts
# Then open http://localhost:8080
#
# For a real deployment, use strong secrets in .env, serve over HTTPS and remove
# HTTPS=false from .env (HTTPS defaults to on), and set a random CODE_RUNNER_TOKEN.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iga
      POSTGRES_USER: iga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iga-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iga -d iga"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment: &backend-env
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env - see .env.docker.example}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATABASE_URL: postgres://iga:${POSTGRES_PASSWORD:-iga-local-only}@db:5432/iga
      REDIS_URL: redis://redis:6379/0
      HTTPS: ${HTTPS:-true}
      # nginx in front appends the client address to X-Forwarded-For.
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # C++ and Java in the code playground. Set CODE_RUNNER_URL= (empty) in .env to switch them off.
      CODE_RUNNER_URL: ${CODE_RUNNER_URL-http://coderunner:2000}
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-iga-local-code-runner}
      # Protected past-paper files are sent by nginx after Django checks access.
      PROTECTED_MEDIA_ACCEL: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # School subscriptions (see .env.docker.example).
      SUBSCRIPTION_PRICE_USD: ${SUBSCRIPTION_PRICE_USD:-200}
      SUBSCRIPTION_PRICE_RWF: ${SUBSCRIPTION_PRICE_RWF:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      BILLING_DEV_MODE: ${BILLING_DEV_MODE:-false}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_HASH: ${FLUTTERWAVE_WEBHOOK_HASH:-}
      CHECKOUT_SESSION_MINUTES: ${CHECKOUT_SESSION_MINUTES:-60}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Iga <no-reply@iga.rw>}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # Threads per worker, so slow calls (the AI tutor, C++/Java runs) don't hold up other requests.
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    volumes:
      - media:/app/media
    networks: [default, coderunner]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Sends subscription reminders to school administrators once a day.
  scheduler:
    build: ./backend
    # Every 10 minutes: re-check open payments (lost webhooks, abandoned checkouts) and send any
    # subscription reminders that are due (each is sent once, so running often is safe).
    # Waits until the backend has applied the database migrations, so the first run finds the tables.
    command: sh -c "until python manage.py migrate --check > /dev/null 2>&1; do sleep 5; done; while true; do python manage.py reconcile_payments; python manage.py billing_reminders; sleep 600; done"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  # Compiles and runs students' C++ and Java (coderunner/: official GCC and OpenJDK images, nothing to
  # download at start). Only the backend can reach it: no published port, and its network has no internet.
  # Each program runs as its own unprivileged user with time, memory, process and output limits; the
  # container itself has no other privileges.
  coderunner:
    build: ./coderunner
    init: true
    restart: unless-stopped
    environment:
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-iga-local-code-runner}
      CODE_RUNNER_SLOTS: ${CODE_RUNNER_SLOTS:-4}
    cap_drop: [ALL]
    # Start each program as its slot's user, clean up after it, and see when it waits for input.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, SYS_PTRACE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=256m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    networks: [coderunner]

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:

networks:
  default: {}
  # Internal only: the code runner can't reach the internet, and only the backend can reach it.
  coderunner:
    internal: true
